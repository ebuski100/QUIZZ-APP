<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QuizVilla" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script src="./styles/theme.js"></script>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="./images/apple-touch-icon.png" />
    <title>You're offline | QuizVilla</title>
    <link rel="icon" type="image/png" href="./images/idea.png" />
    <link rel="stylesheet" href="./styles/design-system.css" />
    <link rel="stylesheet" href="./styles/theme.css" />
    <style>
      body { display:grid; min-height:100vh; place-items:center; padding:24px; }
      main { width:min(100%,520px); padding:clamp(28px,7vw,48px); border:1px solid var(--qv-border); border-radius:26px; background:linear-gradient(145deg,var(--qv-surface-raised),var(--qv-surface)); box-shadow:var(--qv-shadow-card); text-align:center; }
      img { width:72px; height:72px; margin:0 auto 20px; object-fit:contain; }
      h1 { margin:0 0 12px; font-size:clamp(1.7rem,6vw,2.2rem); }
      p { margin:0 0 24px; color:var(--qv-text-soft); line-height:1.65; }
    </style>
  </head>
  <body>
    <main>
      <img src="./images/idea.png" alt="" />
      <h1>You're offline</h1>
      <p>QuizVilla's saved pages are available, but starting a quiz and loading fresh avatars or daily facts need an internet connection. Reconnect and try again.</p>
      <a class="qv-primary-button" href="./index.html">Return to QuizVilla</a>
    </main>
  </body>
</html>
