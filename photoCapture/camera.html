<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <script src="../styles/theme.js"></script>
    <script src="../scripts/pwa.js" defer></script>
    <link rel="manifest" href="../manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="../images/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QuizVilla" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0b1220" />
    <title>Take a photo | QuizVilla</title>
    <link rel="icon" type="image/png" href="../images/idea.png" />
    <link rel="stylesheet" href="camera.css" />
    <link rel="stylesheet" href="../styles/theme.css" />
  </head>
  <body>
    <main class="camera-page">
      <header class="camera-header">
        <button
          id="cancel-button"
          class="icon-button btn"
          type="button"
          aria-label="Cancel and return to profile"
        >
          <img src="../images/left.png" alt="" />
        </button>
        <a
          class="brand-lockup"
          href="../homepage/home.html"
          aria-label="QuizVilla home"
          ><span class="brand-mark"
            ><img src="../images/idea.png" alt="" /></span
          ><span class="brand-copy"
            ><strong>QuizVilla</strong
            ><small>PLAYER PROFILE</small></span
          ></a
        >
        <span class="header-spacer" aria-hidden="true"></span>
      </header>

      <section class="camera-content" aria-labelledby="camera-title">
        <div class="page-intro">
          <span class="eyebrow">MAKE IT YOURS</span>
          <h1 id="camera-title">Take your photo</h1>
          <p class="page-description">
            Frame your shot, capture it, then choose whether to keep
            it.
          </p>
        </div>

        <div class="camera-card">
          <div class="preview-topline">
            <span class="preview-label">LIVE PREVIEW</span
            ><span class="capture-mode" id="capture-mode-label"
              >PROFILE PHOTO</span
            >
          </div>
          <div class="camera-container" id="camera-frame">
            <video
              id="video"
              autoplay
              muted
              playsinline
              aria-label="Live camera preview"
            ></video>
            <img
              id="captured-image"
              alt="Captured photo preview"
              hidden
            />
            <div class="preview-shade" aria-hidden="true">
              <span class="corner corner-tl"></span
              ><span class="corner corner-tr"></span
              ><span class="corner corner-bl"></span
              ><span class="corner corner-br"></span>
            </div>
            <div
              class="camera-placeholder"
              id="camera-placeholder"
              aria-hidden="true"
            >
              <span class="placeholder-ring"
                ><img src="../images/camera.png" alt=""
              /></span>
            </div>
            <canvas id="canvas" hidden></canvas>
          </div>

          <p
            class="camera-status"
            id="camera-status"
            role="status"
            aria-live="polite"
          >
            Connecting to your camera…
          </p>
          <p
            class="camera-error"
            id="camera-error"
            role="alert"
            hidden
          ></p>

          <div class="camera-actions">
            <button
              id="retry-camera"
              class="secondary-button btn"
              type="button"
              hidden
            >
              Try camera again
            </button>
            <button
              id="capture-button"
              class="primary-button btn"
              type="button"
              disabled
            >
              <span class="shutter-icon" aria-hidden="true"></span
              >Take photo
            </button>
            <button
              id="retake-button"
              class="secondary-button btn"
              type="button"
              hidden
            >
              Retake
            </button>
            <button
              id="confirm-button"
              class="primary-button btn"
              type="button"
              hidden
            >
              Use this photo <span aria-hidden="true">→</span>
            </button>
          </div>
          <p class="privacy-note">
            <span aria-hidden="true">◈</span> Your photo stays on this
            device.
          </p>
        </div>
      </section>
      <audio id="backgroundMusic" loop preload="metadata">
        <source src="../sounds/alan_walker.mp3" type="audio/mpeg" />
      </audio>
      <audio id="soundEffect" preload="auto">
        <source src="../sounds/buttonClick.mp3" type="audio/mpeg" />
      </audio>
    </main>
    <script src="camera.js"></script>
  </body>
</html>
