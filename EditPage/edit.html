<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <script src="../styles/theme.js"></script>
    <meta name="theme-color" content="#090f22" />
    <title>QuizVilla | Edit Profile</title>
    <link rel="icon" type="image/png" href="../images/idea.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="edit.css" />
    <link rel="stylesheet" href="../styles/theme.css" />
    <script src="edit.js" defer></script>
  </head>
  <body>
    <main class="edit-container">
      <header class="edit-header">
        <button
          class="icon-btn editQuitBtn btn"
          type="button"
          aria-label="Go back"
        >
          <img src="../images/left.png" alt="" />
        </button>
        <div class="header-copy">
          <span class="eyebrow">YOUR ACCOUNT</span>
          <h1>Edit profile</h1>
          <p>Make your QuizVilla profile yours.</p>
        </div>
        <span class="header-mark" aria-hidden="true">QV</span>
      </header>

      <section class="profile-card" aria-labelledby="profile-heading">
        <div class="profile-topline">
          <span class="section-kicker">PROFILE PICTURE</span>
          <button
            class="text-button banner-edit-btn btn"
            type="button"
          >
            <img src="../images/camera.png" alt="" />
            <span>Edit</span>
          </button>
        </div>
        <div class="edit-img">
          <div class="image-avatar">
            <img
              src="../images/user (8).png"
              id="chosen-image"
              width="150"
              height="150"
              alt="Your profile picture"
            />
          </div>
        </div>
        <h2 id="profile-heading" class="profile-name">
          Your player profile
        </h2>
        <p class="profile-hint">
          Choose an avatar, take a photo, or upload an image.
        </p>
      </section>

      <section class="details-card" aria-labelledby="details-heading">
        <div class="section-heading">
          <span class="section-kicker">PLAYER DETAILS</span>
          <h2 id="details-heading">Personal information</h2>
        </div>
        <div class="form-fields">
          <div class="field-group username-group">
            <label for="nickname" class="nickname">Username</label>
            <input
              id="nickname"
              type="text"
              class="nickName usernameInput"
              maxlength="24"
              autocomplete="nickname"
              placeholder="Enter your username"
            />
          </div>
          <div class="field-row">
            <div class="field-group">
              <label for="Age" class="age">Age</label>
              <select class="select-age" name="age" id="Age">
                <option value="">Select age</option>
                <option value="13">13</option>
                <option value="14">14</option>
                <option value="15">15</option>
                <option value="16">16</option>
                <option value="17">17</option>
                <option value="18">18</option>
                <option value="19">19</option>
                <option value="20">20</option>
                <option value="21">21</option>
                <option value="22">22</option>
                <option value="23">23</option>
                <option value="24">24</option>
                <option value="25">25</option>
                <option value="26">26</option>
                <option value="27">27</option>
                <option value="28">28</option>
                <option value="29">29</option>
                <option value="30">30</option>
                <option value="31">31</option>
                <option value="32">32</option>
                <option value="33">33</option>
                <option value="34">34</option>
                <option value="35">35</option>
                <option value="36">36</option>
                <option value="37">37</option>
                <option value="38">38</option>
                <option value="39">39</option>
                <option value="40">40</option>
                <option value="41">41</option>
                <option value="42">42</option>
                <option value="43">43</option>
                <option value="44">44</option>
                <option value="45">45</option>
                <option value="46">46</option>
                <option value="47">47</option>
                <option value="48">48</option>
                <option value="49">49</option>
                <option value="50">50</option>
                <option value="51">51</option>
                <option value="52">52</option>
                <option value="53">53</option>
                <option value="54">54</option>
                <option value="55">55</option>
                <option value="56">56</option>
                <option value="57">57</option>
                <option value="58">58</option>
                <option value="59">59</option>
                <option value="60">60</option>
              </select>
            </div>
            <div class="field-group">
              <label for="gender" class="gender">Gender</label>
              <select class="select-gender" name="gender" id="gender">
                <option value="">Prefer not to say</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
              </select>
            </div>
          </div>
        </div>
        <p
          class="form-note"
          id="form-message"
          role="status"
          aria-live="polite"
        ></p>
        <div class="button-cont">
          <button class="submit btn" type="button">
            Save changes <span aria-hidden="true">→</span>
          </button>
        </div>
      </section>

      <div class="modal" id="myModal" aria-hidden="true">
        <button
          class="modal-backdrop"
          type="button"
          id="modal-backdrop"
          aria-label="Close profile picture options"
        ></button>
        <section
          class="modal-content"
          role="dialog"
          aria-modal="true"
          aria-labelledby="modal-title"
        >
          <button
            class="close btn"
            id="close-pics-modal"
            type="button"
            aria-label="Close"
          >
            &times;
          </button>
          <div class="modal-header">
            <span class="modal-icon" aria-hidden="true">✦</span>
            <div>
              <span class="section-kicker">PERSONALISE</span>
              <h2 class="modal-header-title" id="modal-title">
                Profile picture
              </h2>
            </div>
          </div>
          <div class="modal-body">
            <button
              type="button"
              class="modal-body-item choose-avatar btn"
            >
              <span class="option-icon">◈</span
              ><span
                ><strong>Choose an avatar</strong
                ><small
                  >Pick from the QuizVilla collection</small
                ></span
              ><span class="option-arrow">›</span>
            </button>
            <button
              type="button"
              id="profile-camera-btn"
              class="modal-body-item btn"
            >
              <span class="option-icon">◎</span
              ><span
                ><strong>Take a photo</strong
                ><small>Use your device camera</small></span
              ><span class="option-arrow">›</span>
            </button>
            <button
              type="button"
              id="profileGalleryBtn"
              class="modal-body-item profileGallery btn"
            >
              <span class="option-icon">▧</span
              ><span
                ><strong>Upload from gallery</strong
                ><small>Choose an image from your device</small></span
              ><span class="option-arrow">›</span>
              <input
                type="file"
                id="profileGalleryInput"
                accept="image/*"
                hidden
              />
            </button>
            <button
              type="button"
              class="modal-body-item remove-profile-btn btn"
            >
              <span class="option-icon remove-icon">×</span
              ><span
                ><strong class="delete-text">Remove picture</strong
                ><small
                  >Return to the default profile image</small
                ></span
              ><span class="option-arrow">›</span>
            </button>
          </div>
          <p class="modal-footer">Choose an option to continue</p>
        </section>
      </div>

      <audio id="backgroundMusic" loop>
        <source src="../sounds/alan_walker.mp3" type="audio/mpeg" />
      </audio>
      <audio id="soundEffect">
        <source src="../sounds/buttonClick.mp3" type="audio/mpeg" />
      </audio>
    </main>
    <nav class="footer" aria-label="Main navigation">
      <a class="home tooltip-box btn" href="../homepage/home.html" aria-label="Home"><img class="footer-btn" src="../images/home (1).png" alt="" /><span class="tooltip">Home</span></a>
      <a class="profile tooltip-box btn" href="edit.html" aria-current="page" aria-label="Profile"><img class="footer-btn" src="../images/user.png" alt="" /><span class="tooltip">Profile</span></a>
      <a class="setting-icon tooltip-box btn" href="../SettingsPage/setting.html" aria-label="Settings"><img class="footer-btn" src="../images/settings.png" alt="" /><span class="tooltip">Settings</span></a>
      <a class="store tooltip-box btn" href="../StorePage/store.html" aria-label="Store"><img class="footer-btn" src="../images/grocery-store.png" alt="" /><span class="tooltip">Store</span></a>
    </nav>
  </body>
</html>
